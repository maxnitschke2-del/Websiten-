<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foodtruck Empire</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-money">
        <span class="hud-money-icon">💰</span>
        <span id="hud-money-value">0</span>
      </div>
      <div class="hud-income">+<span id="hud-income-value">0</span>/s</div>
      <button id="mute-btn" class="mute-btn" type="button" aria-label="Ton an/aus">🔊</button>
    </header>

    <div id="location-bar">
      <div class="loc-info">
        <span id="loc-name">📍</span>
        <span id="loc-progress" class="loc-progress"></span>
      </div>
      <span id="loc-bonus" class="loc-bonus" hidden></span>
      <button id="move-btn" class="move-btn" type="button" hidden></button>
    </div>

    <main id="scene-wrap">
      <div id="scene"></div>
    </main>

    <section id="panel"></section>

    <section id="achievements">
      <div class="ach-header">🏆 Erfolge <span id="ach-count"></span></div>
      <div class="ach-grid" id="ach-grid"></div>
    </section>
  </div>
  <div id="modal-root"></div>

  <script src="vendor/gsap.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
